[project]
name = "demo-fastapi-aws-ecs"
version = "0.1.0"
description = "FastAPI application for AWS ECS Fargate demo"
dependencies = [
    "fastapi>=0.115.8",
    "starlette>=0.49.1",
    "uvicorn>=0.34.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "pytest>=8.3.4",
    "httpx>=0.28.1",
]
dev = [
    "ruff>=0.9.6",
]

[build-system]
requires = ["setuptools>=78.1.1", "wheel>=0.46.2", "jaraco.context>=6.1.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
